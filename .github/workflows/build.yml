name: Build

# build-linux / build-windows corren en cada push/PR (feedback rapido, mismos
# comandos que scripts/build.sh linux|windows ya usan en local). package-msi
# solo corre en tags "v*" o disparado a mano (workflow_dispatch) -- arma el
# instalador de verdad, y los runners windows-latest son mas limitados que
# los de Linux en el plan gratis de GitHub, no vale la pena gastarlos en
# cada commit suelto.
on:
  push:
    branches: [main, beta]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build libglfw3-dev libgl1-mesa-dev libx11-dev \
            libxcomposite-dev libopencv-dev libpipewire-0.3-dev libdbus-1-dev

      - name: Configurar
        run: cmake -B build-linux -G Ninja -DPROYECTHOR_BUILD_NUMBER=${{ github.run_number }}

      - name: Compilar
        run: cmake --build build-linux

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProyecThor-linux-${{ github.run_number }}
          path: |
            build-linux/**
            !build-linux/CMakeFiles/**
            !build-linux/_deps/**
            !build-linux/generated/**
            !build-linux/**/*.o
            !build-linux/**/*.ninja
            !build-linux/.ninja_log
            !build-linux/.ninja_deps
            !build-linux/CMakeCache.txt
            !build-linux/cmake_install.cmake
          if-no-files-found: error

  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar mingw-w64 (cross-compile, igual que scripts/build.sh windows)
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 ninja-build

      - name: Configurar
        run: |
          cmake -B build-win -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$(pwd)/toolchain-mingw.cmake" \
            -DPROYECTHOR_BUILD_NUMBER=${{ github.run_number }}

      - name: Compilar
        run: cmake --build build-win

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProyecThor-windows-${{ github.run_number }}
          path: |
            build-win/**
            !build-win/CMakeFiles/**
            !build-win/_deps/**
            !build-win/generated/**
            !build-win/**/*.o
            !build-win/**/*.ninja
            !build-win/.ninja_log
            !build-win/.ninja_deps
            !build-win/CMakeCache.txt
            !build-win/cmake_install.cmake
          if-no-files-found: error

  # Arma el instalador MSI con WiX Toolset (reemplaza el .iss/Inno Setup
  # manual). Ver packaging/windows/ProyecThor.wxs para el detalle de que
  # hace (instala sin admin, se auto-actualiza via MajorUpgrade, y borra
  # una instalacion vieja de Inno Setup si la encuentra).
  package-msi:
    needs: build-windows
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    env:
      # Version del MSI (formato Major.Minor.Build.Revision) -- mantener
      # sincronizada a mano con el "project(VERSION ...)" de CMakeLists.txt
      # cuando se bump-ea la version del proyecto.
      PRODUCT_VERSION: 0.4.1.0
    steps:
      - uses: actions/checkout@v4

      - name: Descargar build de Windows
        uses: actions/download-artifact@v4
        with:
          name: ProyecThor-windows-${{ github.run_number }}
          path: build-win

      - name: Instalar WiX Toolset
        run: dotnet tool install --global wix --version 5.*

      - name: Agregar extension de UI de WiX
        run: wix extension add -g WixToolset.UI.wixext

      - name: Compilar instalador (.msi)
        run: >
          wix build packaging/windows/ProyecThor.wxs
          -arch x64
          -ext WixToolset.UI.wixext
          -d BuildDir="build-win"
          -d ProductVersion="${{ env.PRODUCT_VERSION }}"
          -out ProyecThor_Setup.msi

      - name: Subir instalador
        uses: actions/upload-artifact@v4
        with:
          name: ProyecThor_Setup-${{ github.run_number }}
          path: ProyecThor_Setup.msi
